# application-dev.yaml、application-test.yaml
spring:
  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/devdata

blog:
  app-name: ${BLOG_APP_NAME:青禾边}
  site-url: ${BLOG_SITE_URL:http://localhost:5173}
  description: ${BLOG_DESC:本地开发博客}
  logo-url: ${BLOG_LOGO_URL:https://example.com/site-logo.png}
  seo:
    html-template: ${BLOG_SEO_HTML_TEMPLATE:file:../frontend/index.html}
  auth:
    refresh-cookie:
      secure: false
  jwt:
    access-ttl: 1d
  mail:
    enabled: false
  turnstile:
    enabled: ${BLOG_TURNSTILE_ENABLED:true}
    secret-key: ${BLOG_TURNSTILE_SECRET_KEY:}
    expected-hostname: ${BLOG_TURNSTILE_EXPECTED_HOSTNAME:}
    # 官方测试密钥的验证响应不返回 action，开发环境不做上下文匹配。
    expected-action: ${BLOG_TURNSTILE_EXPECTED_ACTION:}

logging:
  level:
    org.flywaydb: DEBUG
