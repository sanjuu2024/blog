      summary: 更新文章
      description: 权限级别 `ADMIN`。
      operationId: updateAdminArticle
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ArticleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleUpsertRequest'
