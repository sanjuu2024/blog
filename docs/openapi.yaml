      description: 权限级别 `ADMIN`。支持启用或禁用用户；管理员不能修改当前登录用户自身状态。状态修改为 DISABLED 时会撤销该用户全部活跃 Refresh Token；修改为 ACTIVE 时不撤销 Refresh Token。P0 阶段已签发 Access Token 依赖 15 分钟短有效期自然过期，P1 阶段通过 tokenVersion 支持立即失效。
      operationId: updateAdminUserStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
