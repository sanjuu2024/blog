components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PageNum:
      name: pageNum
      in: query
      description: 当前页码，从 1 开始，默认 1
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1
    PageSize:
      name: pageSize
      in: query
      description: 每页条数，默认 10
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 10
        example: 10
    ArticleId:
      name: articleId
      in: path
      description: 文章 ID
      required: true
      schema:
        type: integer
        format: int64
        example: 40001
    CategoryId:
      name: categoryId
      in: path
      description: 分类 ID
      required: true
      schema:
        type: integer
        format: int64
        example: 20001
    TagId:
      name: tagId
      in: path
      description: 标签 ID
      required: true
      schema:
        type: integer
        format: int64
        example: 30001
    UserId:
      name: userId
      in: path
      description: 用户 ID
      required: true
      schema:
        type: integer
        format: int64
        example: 10002
  schemas:
    BaseResponse:
      type: object
      required:
        - code
        - message
        - traceId
        - timestamp
      properties:
        code:
          type: string
          description: 业务状态码，`0` 表示成功
          example: '0'
        message:
          type: string
          description: 业务描述信息
          example: success
        traceId:
          type: string
          description: 链路追踪 ID
          example: f9a7b6d8c1e24f0b
        timestamp:
          type: string
          format: date-time
          description: 响应时间
          example: '2026-04-22T22:10:00+08:00'
    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              nullable: true
              description: 错误场景通常为空
              example: null
    SuccessData:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: 是否执行成功
          example: true
    SuccessResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/SuccessData'
    PagedMeta:
      type: object
      required:
        - pageNum
        - pageSize
        - total
        - totalPages
        - hasNext
      properties:
        pageNum:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 10
        total:
          type: integer
          format: int64
          example: 35
        totalPages:
          type: integer
          example: 4
        hasNext:
          type: boolean
          example: true
    SimpleTag:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          example: 30001
        name:
          type: string
          example: JWT
    CategoryParentRef:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          example: 20001
        name:
          type: string
          example: 技术
    SimpleCategory:
      type: object
      required:
        - id
        - name
        - level
        - parent
      properties:
        id:
          type: integer
          format: int64
          example: 21001
        name:
          type: string
          example: Java
        level:
          type: integer
          enum:
            - 2
          example: 2
        parent:
          $ref: '#/components/schemas/CategoryParentRef'
    SimpleAuthor:
      type: object
      required:
        - id
        - username
        - nickname
      properties:
        id:
          type: integer
          format: int64
          example: 10001
        username:
          type: string
          example: ccsanjuu
        nickname:
          type: string
          example: sanjuu
    LoginUserInfo:
      type: object
      required:
        - id
        - username
        - nickname
        - email
        - role
        - status
        - avatarUrl
        - bio
      properties:
        id:
          type: integer
          format: int64
          example: 10002
        username:
          type: string
          example: alice_dev
        nickname:
          type: string
          example: Alice
        email:
          type: string
          format: email
          example: alice@example.com
        role:
          type: string
          enum:
            - ADMIN
            - USER
          example: USER
        status:
          type: string
          enum:
            - ACTIVE
            - DISABLED
          example: ACTIVE
        avatarUrl:
          type: string
          example: ''
        bio:
          type: string
          example: 热爱前后端开发
    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          description: 用户名，需唯一
          example: alice_dev
        email:
          type: string
          format: email
          description: 邮箱，需唯一
          example: alice@example.com
        password:
          type: string
          format: password
          description: 登录密码
          example: Passw0rd!
    LoginRequest:
      type: object
      required:
        - account
        - password
      properties:
        account:
          type: string
          description: 登录账号，支持用户名或邮箱
          example: alice@example.com
        password:
          type: string
          format: password
          description: 登录密码
          example: Passw0rd!
    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: Refresh Token
          example: eyJhbGciOiJIUzI1NiJ9.refresh.token
    LogoutRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: 当前会话的 Refresh Token
          example: eyJhbGciOiJIUzI1NiJ9.refresh.token
    RegisterData:
      type: object
      required:
        - userId
        - username
        - nickname
        - email
        - role
        - status
        - createdAt
      properties:
        userId:
          type: integer
          format: int64
          example: 10002
        username:
          type: string
          example: alice_dev
        nickname:
          type: string
          example: ''
        email:
          type: string
          format: email
          example: alice@example.com
        role:
          type: string
          enum:
            - ADMIN
            - USER
          example: USER
        status:
          type: string
          enum:
            - ACTIVE
            - DISABLED
          example: ACTIVE
        createdAt:
          type: string
          format: date-time
          example: '2026-04-22T22:20:00+08:00'
    RegisterResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RegisterData'
    LoginData:
      type: object
      required:
        - accessToken
        - accessTokenExpiresAt
        - refreshToken
        - refreshTokenExpiresAt
        - tokenType
        - user
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9.access.token
        accessTokenExpiresAt:
          type: string
          format: date-time
          example: '2026-04-22T23:20:00+08:00'
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9.refresh.token
        refreshTokenExpiresAt:
          type: string
