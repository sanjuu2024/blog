server:
  forward-headers-strategy: framework   # 处理 nginx 反向代理的配置

blog:
  app-name: ${BLOG_APP_NAME:}
  site-url: ${BLOG_SITE_URL:}
  description: ${BLOG_DESC:}
  logo-url: ${BLOG_LOGO_URL:}
  require-https-site-url: true
  require-https-logo-url: true
  auth:
    refresh-cookie:
      secure: true
  mail:
    enabled: ${BLOG_MAIL_ENABLED:true}
    frontend-base-url: ${BLOG_MAIL_FRONTEND_BASE_URL:}
  turnstile:
    enabled: ${BLOG_TURNSTILE_ENABLED:true}
    secret-key: ${BLOG_TURNSTILE_SECRET_KEY:}
    expected-hostname: ${BLOG_TURNSTILE_EXPECTED_HOSTNAME:}
    expected-action: ${BLOG_TURNSTILE_EXPECTED_ACTION:guest_message}
