spring:
  datasource:
    url: ${BLOG_TEST_DB_URL}
    username: ${POSTGRES_TEST_APP_USERNAME}
    password: ${POSTGRES_TEST_APP_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      database: ${BLOG_TEST_REDIS_DATABASE:1}
  flyway:
    url: ${BLOG_TEST_DB_URL}
    user: ${POSTGRES_TEST_ADMIN_USERNAME}
    password: ${POSTGRES_TEST_ADMIN_PASSWORD}
    locations:
      - classpath:db/migration
      - classpath:db/devdata

blog:
  app-name: 集成测试站点
  site-url: http://localhost:5173
  description: 用于自动化测试的站点资料
  logo-url: https://img.test.example.com/site-logo.png
  jwt:
    secret: ${BLOG_TEST_JWT_SECRET}
  auth:
    refresh-cookie:
      secure: false
  object-storage:
    provider: aliyun
    endpoint: https://oss-cn-hangzhou.aliyuncs.com
    bucket: blog-test-bucket
    access-key-id: test-access-key-id
    access-key-secret: test-access-key-secret
    public-base-url: https://img.test.example.com
  mail:
    enabled: false
  turnstile:
    enabled: false
