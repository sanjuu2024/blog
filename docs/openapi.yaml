openapi: 3.0.3
info:
  title: 个人技术博客系统 API
  version: v1
  description: |
    个人技术博客系统 OpenAPI 规范。
    基础路径统一为 `/api/v1/**`，可直接导入 Apifox 使用。
servers:
  - url: http://localhost:8080
    description: 本地开发环境
tags:
  - name: Auth
    description: 认证模块
  - name: Public Articles
    description: 前台公共文章接口
  - name: Profile
    description: 个人中心接口
  - name: Admin Users
    description: 后台用户管理接口
  - name: Admin Articles
    description: 后台文章管理接口
  - name: Admin Categories
    description: 后台分类管理接口
  - name: Admin Tags
    description: 后台标签管理接口
paths:
  /api/v1/auth/register:
    post:
      tags:
        - Auth
      summary: 用户注册
      description: 权限级别 `PUBLIC`。用户通过用户名、邮箱、密码完成注册。
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: alice_dev
              email: alice@example.com
              password: Passw0rd!
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                code: '0'
                message: success
                data:
                  userId: 10002
                  username: alice_dev
                  nickname: ''
                  email: alice@example.com
                  role: USER
                  status: ACTIVE
                  createdAt: '2026-04-22T22:20:00+08:00'
                traceId: 3c5d8f2a0b6344b1
                timestamp: '2026-04-22T22:20:00+08:00'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: 用户登录
      description: 权限级别 `PUBLIC`。支持用户名或邮箱登录。
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              account: alice@example.com
              password: Passw0rd!
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                code: '0'
                message: success
                data:
                  accessToken: eyJhbGciOiJIUzI1NiJ9.access.token
                  accessTokenExpiresAt: '2026-04-22T23:20:00+08:00'
                  refreshToken: eyJhbGciOiJIUzI1NiJ9.refresh.token
                  refreshTokenExpiresAt: '2026-04-29T22:20:00+08:00'
                  tokenType: Bearer
                  user:
                    id: 10002
                    username: alice_dev
                    nickname: Alice
                    email: alice@example.com
                    role: USER
                    status: ACTIVE
                    avatarUrl: ''
                    bio: 热爱前后端开发
                traceId: b3c8900f2d554b4f
                timestamp: '2026-04-22T22:20:10+08:00'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
  /api/v1/auth/refresh:
    post:
      tags:
        - Auth
      summary: 刷新登录态
      description: 权限级别 `PUBLIC`。通过 Refresh Token 获取新令牌。
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            example:
              refreshToken: eyJhbGciOiJIUzI1NiJ9.refresh.token
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
              example:
                code: '0'
                message: success
                data:
                  accessToken: eyJhbGciOiJIUzI1NiJ9.new.access
                  accessTokenExpiresAt: '2026-04-22T23:50:00+08:00'
                  refreshToken: eyJhbGciOiJIUzI1NiJ9.new.refresh
                  refreshTokenExpiresAt: '2026-04-29T22:50:00+08:00'
                  tokenType: Bearer
                traceId: f30b1ed17c9947a2
                timestamp: '2026-04-22T22:50:00+08:00'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/RefreshTokenInvalidResponse'
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      summary: 用户退出登录
      description: 权限级别 `LOGIN`。退出当前会话并使 Refresh Token 失效。
      operationId: logoutUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
            example:
              refreshToken: eyJhbGciOiJIUzI1NiJ9.refresh.token
      responses:
        '200':
          description: 退出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                code: '0'
                message: success
                data:
                  success: true
                traceId: cb16b523eb4f46d2
                timestamp: '2026-04-22T22:55:00+08:00'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
  /api/v1/articles:
    get:
      tags:
        - Public Articles
      summary: 获取已发布文章分页列表
      description: 权限级别 `PUBLIC`。仅返回已发布文章。
      operationId: listPublishedArticles
      parameters:
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
        - name: categoryId
          in: query
          description: 分类 ID。支持一级分类或二级分类；传一级分类时返回其下所有二级分类文章
          required: false
          schema:
            type: integer
            format: int64
            example: 20001
        - name: tagId
          in: query
          description: 标签 ID
          required: false
          schema:
            type: integer
            format: int64
            example: 30001
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicArticlePageResponse'
              example:
                code: '0'
                message: success
                data:
                  records:
                    - id: 40001
                      title: Spring Boot 双 Token 登录实践
                      summary: 本文记录双 Token 的实现思路与接口设计
                      coverUrl: https://cdn.example.com/cover/token.png
                      isTop: true
                      publishedAt: '2026-04-22T23:00:00+08:00'
                      viewCount: 128
                      category:
                        id: 21001
                        name: Java
                        level: 2
                        parent:
                          id: 20001
                          name: 技术
                      tags:
                        - id: 30001
                          name: JWT
                  pageNum: 1
                  pageSize: 10
                  total: 1
                  totalPages: 1
                  hasNext: false
                traceId: 7a4ac2ca74df44ce
                timestamp: '2026-04-22T23:05:00+08:00'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
  /api/v1/articles/{articleId}:
    get:
      tags:
        - Public Articles
      summary: 获取文章详情
      description: 权限级别 `PUBLIC`。仅可查看已发布文章详情。
      operationId: getPublishedArticleDetail
      parameters:
        - $ref: '#/components/parameters/ArticleId'
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicArticleDetailResponse'
              example:
                code: '0'
                message: success
                data:
                  id: 40001
                  title: Spring Boot 双 Token 登录实践
                  summary: 本文记录双 Token 的实现思路与接口设计
                  contentHtml: <h1>一、背景</h1><p>这里是文章正文</p>
                  coverUrl: https://cdn.example.com/cover/token.png
                  isTop: true
                  allowComment: true
                  viewCount: 128
                  commentCount: 0
                  likeCount: 0
                  favoriteCount: 0
                  publishedAt: '2026-04-22T23:00:00+08:00'
                  updatedAt: '2026-04-22T23:10:00+08:00'
                  category:
                    id: 21001
                    name: Java
                    level: 2
                    parent:
                      id: 20001
                      name: 技术
                  tags:
                    - id: 30001
                      name: JWT
                  author:
                    id: 10001
                    username: ccsanjuu
                    nickname: sanjuu
                traceId: 1d65ea705b9b45d5
                timestamp: '2026-04-22T23:10:00+08:00'
        '404':
          $ref: '#/components/responses/ArticleNotFoundResponse'
  /api/v1/categories:
    get:
      tags:
        - Public Articles
      summary: 获取启用分类列表
      description: 权限级别 `PUBLIC`。返回一级分类树，二级分类挂载在 `children` 字段。
      operationId: listEnabledCategories
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCategoryListResponse'
              example:
                code: '0'
                message: success
                data:
                  - id: 20001
                    name: 技术
                    level: 1
                    description: 技术内容一级分类
                    sortNo: 10
                    articleCount: 18
                    children:
                      - id: 21001
                        parentId: 20001
                        name: Java
                        level: 2
                        description: Java 相关文章
                        sortNo: 11
                        articleCount: 6
                      - id: 21002
                        parentId: 20001
                        name: 算法
                        level: 2
                        description: 算法相关内容
                        sortNo: 12
                        articleCount: 4
                traceId: f28d47e62fd64f3e
                timestamp: '2026-04-22T23:12:00+08:00'
  /api/v1/users/me:
    get:
      tags:
        - Profile
      summary: 获取当前登录用户信息
      description: 权限级别 `LOGIN`。
      operationId: getCurrentUserProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
              example:
                code: '0'
                message: success
                data:
                  id: 10002
                  username: alice_dev
                  nickname: Alice
                  email: alice@example.com
                  role: USER
                  status: ACTIVE
                  avatarUrl: ''
                  bio: 热爱前后端开发
                  lastLoginAt: '2026-04-22T22:20:10+08:00'
                  createdAt: '2026-04-22T22:20:00+08:00'
                traceId: 16d68b769fdc4c44
                timestamp: '2026-04-22T23:15:00+08:00'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
  /api/v1/users/me/profile:
    put:
      tags:
        - Profile
      summary: 更新个人资料
      description: 权限级别 `LOGIN`。支持修改用户名、昵称、个人简介。
      operationId: updateCurrentUserProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              username: alice_dev_new
              nickname: Alice
              bio: 专注 Java 与前端工程化
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateProfileResponse'
              example:
                code: '0'
                message: success
                data:
                  id: 10002
                  username: alice_dev_new
                  nickname: Alice
                  email: alice@example.com
                  avatarUrl: ''
                  bio: 专注 Java 与前端工程化
                  updatedAt: '2026-04-22T23:20:00+08:00'
                traceId: 727541ef1e1c4f77
                timestamp: '2026-04-22T23:20:00+08:00'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
  /api/v1/users/me/password:
    put:
      tags:
        - Profile
      summary: 修改密码
      description: 权限级别 `LOGIN`。修改当前登录用户密码。
      operationId: changeCurrentUserPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              oldPassword: Passw0rd!
              newPassword: NewPassw0rd!
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                code: '0'
                message: success
                data:
                  success: true
                traceId: b167021c836f4712
                timestamp: '2026-04-22T23:25:00+08:00'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
  /api/v1/admin/users:
    get:
      tags:
        - Admin Users
      summary: 获取用户分页列表
      description: 权限级别 `ADMIN`。支持按用户名、邮箱、状态、角色筛选。
      operationId: listAdminUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
        - name: keyword
          in: query
          description: 用户名或邮箱模糊搜索关键字
          required: false
          schema:
            type: string
            example: alice
        - name: role
          in: query
          description: 角色筛选
          required: false
          schema:
            type: string
            enum:
              - ADMIN
              - USER
            example: USER
        - name: status
          in: query
          description: 状态筛选
          required: false
          schema:
            type: string
            enum:
              - ACTIVE
              - DISABLED
            example: ACTIVE
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPageResponse'
              example:
                code: '0'
                message: success
                data:
                  records:
                    - id: 10002
                      username: alice_dev
                      nickname: Alice
                      email: alice@example.com
                      role: USER
                      status: ACTIVE
                      lastLoginAt: '2026-04-22T22:20:10+08:00'
                      createdAt: '2026-04-22T22:20:00+08:00'
                  pageNum: 1
                  pageSize: 10
                  total: 1
                  totalPages: 1
                  hasNext: false
                traceId: ccd57c77325a482e
                timestamp: '2026-04-22T23:30:00+08:00'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
  /api/v1/admin/users/{userId}/status:
    patch:
      tags:
        - Admin Users
      summary: 修改用户状态
      description: 权限级别 `ADMIN`。支持启用或禁用用户。
      operationId: updateAdminUserStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
            example:
              status: DISABLED
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUserStatusResponse'
              example:
                code: '0'
                message: success
                data:
                  id: 10002
                  status: DISABLED
                  updatedAt: '2026-04-22T23:35:00+08:00'
                traceId: 9f9b6261c0ad40c1
                timestamp: '2026-04-22T23:35:00+08:00'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
  /api/v1/admin/users/{userId}/role:
    patch:
      tags:
        - Admin Users
      summary: 修改用户角色
      description: 权限级别 `ADMIN`。支持将用户修改为管理员或普通用户。
      operationId: updateAdminUserRole
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRoleRequest'
            example:
              role: ADMIN
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUserRoleResponse'
              example:
                code: '0'
                message: success
                data:
                  id: 10002
                  role: ADMIN
                  updatedAt: '2026-04-22T23:36:00+08:00'
                traceId: c4d95157647e4f5d
                timestamp: '2026-04-22T23:36:00+08:00'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
  /api/v1/admin/articles:
    get:
      tags:
        - Admin Articles
      summary: 获取后台文章分页列表
      description: 权限级别 `ADMIN`。支持按标题、分类、状态、置顶状态筛选。
      operationId: listAdminArticles
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
        - name: title
          in: query
          description: 标题模糊搜索
          required: false
          schema:
            type: string
            example: Token
        - name: categoryId
          in: query
          description: 分类 ID。支持一级分类或二级分类筛选；文章实际绑定的仍是二级分类
          required: false
          schema:
            type: integer
            format: int64
            example: 20001
        - name: status
          in: query
          description: 文章状态
          required: false
          schema:
            type: string
            enum:
              - DRAFT
              - PUBLISHED
              - OFFLINE
            example: DRAFT
        - name: isTop
          in: query
          description: 是否置顶
          required: false
          schema:
            type: boolean
            example: true
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticlePageResponse'
              example:
                code: '0'
                message: success
                data:
                  records:
                    - id: 40001
                      title: Spring Boot 双 Token 登录实践
