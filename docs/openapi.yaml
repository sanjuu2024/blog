                  value:
                    code: 101003
                    message: 无权限访问
                    data: null
                selfStatusChangeNotAllowed:
                  summary: 不允许修改当前登录用户状态
                  value:
                    code: 102008
                    message: 当前用户不允许修改自己的状态
                    data: null
