spring:
  datasource:
    url: ${BLOG_DB_URL}
    username: ${BLOG_DB_USERNAME}
    password: ${BLOG_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${BLOG_REDIS_HOST:localhost}
      port: ${BLOG_REDIS_PORT:6379}
      password: ${BLOG_REDIS_PASSWORD:}
      database: ${BLOG_REDIS_DATABASE:0}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    encoding: utf-8
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

mybatis-plus:
  type-aliases-package: com.ccsanjuu.blog.**.entity   # 实体类所在的包，默认值
  mapper-locations: "classpath*:/mapper/**/*.xml"
  configuration:
    map-underscore-to-camel-case: true   # 是否开启下划线和驼峰的映射
    cache-enabled: false   # 是否开启二级缓存
  global-config:
    db-config:
      id-type: auto   # 主键自增
      update-strategy: not_null   # 更新策略：只更新非空字段

blog:
  jwt:
    issuer: sanjuu-blog
    secret: ${BLOG_JWT_SECRET}   # base64 编码的 JWT 密钥
    access-ttl: 15m
    refresh-ttl: 7d
  auth:
    refresh-cookie:
      secure: true   # 默认为 true 作为安全兜底
  object-storage:
    provider: ${BLOG_OBJECT_STORAGE_PROVIDER:aliyun}
    endpoint: ${BLOG_OBJECT_STORAGE_ENDPOINT}
    bucket: ${BLOG_OBJECT_STORAGE_BUCKET}
    access-key-id: ${BLOG_OBJECT_STORAGE_ACCESS_KEY_ID}
    access-key-secret: ${BLOG_OBJECT_STORAGE_ACCESS_KEY_SECRET}
    public-base-url: ${BLOG_OBJECT_STORAGE_PUBLIC_BASE_URL}
