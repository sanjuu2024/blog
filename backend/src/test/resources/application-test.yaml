spring:
  datasource:
    url: ${BLOG_TEST_DB_URL}
    username: ${BLOG_TEST_DB_USERNAME}
    password: ${BLOG_TEST_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      database: ${BLOG_TEST_REDIS_DATABASE:1}
  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/devdata

blog:
  jwt:
    secret: ${BLOG_TEST_JWT_SECRET}
  auth:
    refresh-cookie:
      secure: false
  object-storage:
    provider: aliyun
    endpoint: https://oss-cn-hangzhou.aliyuncs.com
    bucket: blog-test-bucket
    access-key-id: test-access-key-id
    access-key-secret: test-access-key-secret
    public-base-url: https://img.test.example.com
  mail:
    enabled: false
