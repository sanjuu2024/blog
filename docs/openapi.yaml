openapi: 3.0.3
info:
  title: 个人技术博客系统 API
  version: v1
  description: |
    个人技术博客系统 OpenAPI 规范。
    基础路径统一为 `/api/v1/**`，可直接导入 Apifox 使用。
servers:
  - url: http://localhost:8080
    description: 本地开发环境
tags:
  - name: Auth
    description: 认证模块
  - name: Public Articles
    description: 前台公共文章接口
  - name: Public Comments
    description: 前台评论接口
  - name: Public Users
    description: 前台公共用户接口
  - name: Profile
    description: 个人中心接口
  - name: Admin Users
    description: 后台用户管理接口
  - name: Admin Comments
    description: 后台评论审核接口
  - name: Admin Articles
    description: 后台文章管理接口
  - name: Admin Categories
    description: 后台分类管理接口
  - name: Admin Tags
    description: 后台标签管理接口
paths:
  /api/v1/auth/register:
    post:
      tags:
        - Auth
      summary: 用户注册
      description: 权限级别 `PUBLIC`。用户通过用户名、邮箱、密码完成注册；服务端默认使用用户名初始化昵称；用户名注册后不可修改。用户名和邮箱唯一性均按大小写不敏感处理，但 username 保留注册时输入的原始大小写用于展示。例如允许用户注册展示名 `Sanjuu`，但不允许另一个人再注册 `sanjuu`；邮箱同理，`A@example.com` 和 `a@example.com` 会识别为同一个邮箱账号，不能重复注册。
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: alice_dev
              email: alice@example.com
              password: Passw0rd!
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                code: 0
                message: 成功
                data: null
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '409':
          $ref: '#/components/responses/UserConflictResponse'
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: 用户登录
      description: 权限级别 `PUBLIC`。支持用户名或邮箱登录；用户名和邮箱登录均按大小写不敏感处理。登录成功后响应体返回 Access Token，Refresh Token 通过 `Set-Cookie` 写入 `refresh_token` HttpOnly Cookie，不返回给前端 JavaScript 读取。
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              account: alice@example.com
              password: Passw0rd!
      responses:
        '200':
          description: 登录成功
          headers:
            Set-Cookie:
              description: 写入 Refresh Token Cookie。生产 HTTPS 环境应启用 Secure。
              schema:
                type: string
                example: refresh_token=eyJhbGciOiJIUzI1NiJ9.refresh.token; Max-Age=604800; Path=/api/v1/auth; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                code: 0
                message: 成功
                data:
                  accessToken: eyJhbGciOiJIUzI1NiJ9.access.token
                  accessTokenExpiresAt: '2026-04-22T22:35:00+08:00'
                  refreshTokenExpiresAt: '2026-04-29T22:20:00+08:00'
                  tokenType: Bearer
                  user:
                    id: 10002
                    username: alice_dev
                    nickname: Alice
                    email: alice@example.com
                    role: USER
                    status: ACTIVE
                    avatarUrl: ''
                    bio: 热爱前后端开发
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/UserDisabledResponse'
  /api/v1/auth/refresh:
    post:
      tags:
        - Auth
      summary: 刷新登录态
      description: 权限级别 `PUBLIC`。通过浏览器自动携带的 `refresh_token` HttpOnly Cookie 获取新令牌；刷新成功后只轮转当前会话的 Refresh Token，不影响同一用户其他设备上的活跃会话。Refresh Token 缺失、格式错误、签名无效、已过期、已撤销或找不到对应会话时返回 101004；P0 阶段不因普通刷新失败自动撤销该用户全部活跃 Refresh Token。
      operationId: refreshToken
      parameters:
        - $ref: '#/components/parameters/RefreshTokenCookie'
      responses:
        '200':
          description: 刷新成功
          headers:
            Set-Cookie:
              description: 轮转 Refresh Token Cookie。生产 HTTPS 环境应启用 Secure。
              schema:
                type: string
                example: refresh_token=eyJhbGciOiJIUzI1NiJ9.new.refresh; Max-Age=604800; Path=/api/v1/auth; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
              example:
                code: 0
                message: 成功
                data:
                  accessToken: eyJhbGciOiJIUzI1NiJ9.new.access
                  accessTokenExpiresAt: '2026-04-22T23:05:00+08:00'
                  refreshTokenExpiresAt: '2026-04-29T22:50:00+08:00'
                  tokenType: Bearer
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/RefreshTokenInvalidResponse'
        '403':
          $ref: '#/components/responses/UserDisabledResponse'
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      summary: 用户退出登录
      description: 权限级别 `PUBLIC`。退出当前会话不要求有效 Access Token；浏览器会自动携带 `refresh_token` HttpOnly Cookie，后端据此尝试撤销对应会话。该接口按幂等语义处理：如果 Refresh Token 缺失、已过期、已撤销或找不到对应会话，仍返回退出成功，前端只需清理本地登录态。
      operationId: logoutUser
      parameters:
        - $ref: '#/components/parameters/RefreshTokenCookieOptional'
      responses:
        '200':
          description: 退出成功
          headers:
            Set-Cookie:
              description: 清除 Refresh Token Cookie。
              schema:
                type: string
                example: refresh_token=; Max-Age=0; Path=/api/v1/auth; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoDataResponse'
              example:
                code: 0
                message: 成功
                data: null
        '400':
          $ref: '#/components/responses/BadRequestResponse'
  /api/v1/articles:
    get:
      tags:
        - Public Articles
      summary: 获取已发布文章分页列表
      description: 权限级别 `PUBLIC`。仅返回已发布文章。响应中的 `tags` 仅包含当前启用且仍存在的关联标签；通过 `tagIds` 筛选时，传入标签必须存在且启用；通过 `categoryId` 筛选时，传入分类必须存在且启用。文章所属二级分类及其父分类均存在且启用时，文章才对前台可见。默认按置顶状态、首次发布时间和文章 ID 倒序；`sort=LATEST` 时忽略置顶状态，仅按首次发布时间和文章 ID 倒序。
      operationId: listPublishedArticles
      parameters:
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
        - name: categoryId
          in: query
          description: 分类 ID。支持一级分类或二级分类；传一级分类时返回其下所有二级分类文章
          required: false
          schema:
            type: integer
            format: int64
            example: 20001
        - name: tagIds
          in: query
          description: 标签 ID 列表；传多个时表示文章必须同时包含这些标签
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
              format: int64
            example:
              - 30001
              - 30002
        - name: isTop
          in: query
          description: 是否置顶；true 只返回置顶文章，false 只返回非置顶文章，不传则不限制
          required: false
          schema:
            type: boolean
            example: true
        - name: sort
          in: query
          description: 排序模式。DEFAULT 为置顶优先；LATEST 忽略置顶状态，仅按首次发布时间倒序
          required: false
          schema:
            type: string
            enum:
              - DEFAULT
              - LATEST
            default: DEFAULT
            example: LATEST
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicArticlePageResponse'
              example:
                code: 0
                message: 成功
                data:
                  records:
                    - id: 40001
                      title: Spring Boot 双 Token 登录实践
                      summary: 本文记录双 Token 的实现思路与接口设计
                      coverUrl: https://cdn.example.com/cover/token.png
                      isTop: true
                      publishedAt: '2026-04-22T23:00:00+08:00'
                      viewCount: 128
                      category:
                        id: 21001
                        name: Java
                        level: 2
                        parent:
                          id: 20001
                          name: 技术
                      tags:
                        - id: 30001
                          name: JWT
                  pageNum: 1
                  pageSize: 10
                  total: 1
                  totalPages: 1
                  hasNext: false
        '400':
          $ref: '#/components/responses/BadRequestResponse'
  /api/v1/articles/{articleId}:
    get:
      tags:
        - Public Articles
      summary: 获取文章详情
      description: 权限级别 `PUBLIC`。仅可查看已发布文章详情。响应中的 `tags` 仅包含当前启用且仍存在的关联标签；历史关联的禁用标签或已被删除的标签不返回，不影响文章详情展示。文章所属二级分类及其父分类必须均存在且启用；分类不存在返回 `ARTICLE_CATEGORY_NOT_FOUND`，分类已禁用返回 `ARTICLE_CATEGORY_DISABLED`。文章关联作者必须存在；作者不存在返回 `ARTICLE_AUTHOR_NOT_FOUND`。P0 以 articleId 定位文章；slug 仅作为 P2 URL 可读化与 SEO 优化预留，不参与当前接口路径。
      operationId: getPublishedArticleDetail
      parameters:
        - $ref: '#/components/parameters/ArticleId'
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicArticleDetailResponse'
              example:
                code: 0
                message: 成功
                data:
                  id: 40001
                  title: Spring Boot 双 Token 登录实践
                  summary: 本文记录双 Token 的实现思路与接口设计
                  contentHtml: <h1>一、背景</h1><p>这里是文章正文</p>
                  coverUrl: https://cdn.example.com/cover/token.png
                  isTop: true
                  allowComment: true
                  viewCount: 128
                  commentCount: 0
                  likeCount: 0
                  favoriteCount: 0
                  publishedAt: '2026-04-22T23:00:00+08:00'
                  updatedAt: '2026-04-22T23:10:00+08:00'
                  category:
                    id: 21001
                    name: Java
                    level: 2
                    parent:
                      id: 20001
                      name: 技术
                  tags:
                    - id: 30001
                      name: JWT
                  author:
                    id: 10001
                    username: ccsanjuu
                    nickname: sanjuu
                    avatarUrl: https://cdn.example.com/avatar/1.png
                    bio: 专注后端和前端工程化
        '404':
          $ref: '#/components/responses/PublicArticleDetailNotFoundResponse'
        '409':
          $ref: '#/components/responses/PublicArticleDetailConflictResponse'
  /api/v1/articles/{articleId}/comments:
    get:
      tags:
        - Public Comments
      summary: 获取文章顶层评论分页列表
      description: 权限级别 `PUBLIC`，可选携带 Access Token。只返回顶层评论，不预载回复。游客只看到 APPROVED；登录用户还可看到自己发表的 PENDING 和 REJECTED 评论。默认按创建时间倒序。
      operationId: listArticleComments
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ArticleId'
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCommentPageResponse'
        '404':
          $ref: '#/components/responses/ArticleNotFoundResponse'
    post:
      tags:
        - Public Comments
      summary: 发表评论或回复
      description: 权限级别 `LOGIN`。parentId 不传时创建顶层评论，传入时创建回复。新内容默认进入 PENDING 审核状态；同一用户对同一文章 10 秒内只能成功创建一条评论或回复。
      operationId: createArticleComment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ArticleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/UserDisabledResponse'
        '404':
          $ref: '#/components/responses/ArticleNotFoundResponse'
        '409':
          $ref: '#/components/responses/CommentConflictResponse'
        '429':
          $ref: '#/components/responses/CommentRateLimitResponse'
  /api/v1/comments/{commentId}/replies:
    get:
      tags:
        - Public Comments
      summary: 获取顶层评论下的回复
      description: 权限级别 `PUBLIC`，可选携带 Access Token。commentId 必须是顶层评论 ID。所有层级回复在响应中平铺，按创建时间正序。首次请求默认取 5 条，后续使用 nextCursor 继续加载。
      operationId: listCommentReplies
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CommentId'
        - $ref: '#/components/parameters/ReplyLimit'
        - $ref: '#/components/parameters/ReplyCursor'
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentReplyPageResponse'
        '404':
          $ref: '#/components/responses/CommentNotFoundResponse'
  /api/v1/comments/{commentId}:
    delete:
      tags:
        - Public Comments
      summary: 删除自己的评论
      description: 权限级别 `LOGIN`。用户只能删除自己的评论；目标评论及其全部后代会在同一事务中逻辑删除。
      operationId: deleteOwnComment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CommentId'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoDataResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/CommentForbiddenResponse'
        '404':
          $ref: '#/components/responses/CommentNotFoundResponse'
  /api/v1/categories:
    get:
      tags:
        - Public Articles
      summary: 获取启用分类列表
      description: 权限级别 `PUBLIC`。返回一级分类树，二级分类挂载在 `children` 字段。仅返回启用分类；一级分类按 `sortNo ASC, id ASC` 排序，每个一级分类下的二级分类也按 `sortNo ASC, id ASC` 排序。
      operationId: listEnabledCategories
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCategoryListResponse'
              example:
                code: 0
                message: 成功
                data:
                  - id: 20001
                    parentId: null
                    name: 技术
                    level: 1
                    description: 技术内容一级分类
                    sortNo: 10
                    articleCount: 18
                    children:
                      - id: 21001
                        parentId: 20001
                        name: Java
                        level: 2
                        description: Java 相关文章
                        sortNo: 11
                        articleCount: 6
                        children: []
                      - id: 21002
                        parentId: 20001
                        name: 算法
                        level: 2
                        description: 算法相关内容
                        sortNo: 12
                        articleCount: 4
                        children: []
  /api/v1/tags:
    get:
      tags:
        - Public Articles
      summary: 获取启用标签列表
      description: 权限级别 `PUBLIC`。用于前台文章列表筛选面板、标签云等公开展示场景，仅返回启用状态的标签；按 `articleCount DESC, name ASC, id ASC` 排序，其中 `articleCount` 为该标签下前台可见已发布文章数量。
      operationId: listEnabledTags
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTagListResponse'
              example:
                code: 0
                message: 成功
                data:
                  - id: 30001
                    name: JWT
                    articleCount: 8
                  - id: 30002
                    name: Spring Boot
                    articleCount: 6
  /api/v1/users/{userId}/public-profile:
    get:
      tags:
        - Public Users
      summary: 获取用户公开资料卡
      description: 权限级别 `PUBLIC`。公开用户资料使用 `userId` 作为路径标识，`username` 作为展示字段。
      operationId: getPublicUserProfile
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserProfileResponse'
              example:
                code: 0
                message: 成功
                data:
                  id: 10001
                  username: ccsanjuu
                  nickname: sanjuu
                  avatarUrl: https://cdn.example.com/avatar/1.png
                  bio: 专注后端和前端工程化
        '404':
          $ref: '#/components/responses/UserNotFoundResponse'
  /api/v1/users/me:
    get:
      tags:
        - Profile
      summary: 获取当前登录用户信息
      description: 权限级别 `LOGIN`。
      operationId: getCurrentUserProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
              example:
                code: 0
                message: 成功
                data:
                  id: 10002
                  username: alice_dev
                  nickname: Alice
                  email: alice@example.com
                  role: USER
                  status: ACTIVE
                  avatarUrl: ''
                  bio: 热爱前后端开发
                  lastLoginAt: '2026-04-22T22:20:10+08:00'
                  createdAt: '2026-04-22T22:20:00+08:00'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
  /api/v1/users/me/profile:
    put:
      tags:
        - Profile
      summary: 更新个人资料
      description: 权限级别 `LOGIN`。支持修改昵称、个人简介；不支持修改用户名，用户名注册后不可修改。
      operationId: updateCurrentUserProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              nickname: Alice
              bio: 专注 Java 与前端工程化
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateProfileResponse'
              example:
                code: 0
                message: 成功
                data:
                  id: 10002
                  username: alice_dev
                  nickname: Alice
                  email: alice@example.com
                  avatarUrl: ''
                  bio: 专注 Java 与前端工程化
                  updatedAt: '2026-04-22T23:20:00+08:00'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
  /api/v1/users/me/password:
    put:
      tags:
        - Profile
      summary: 修改密码
      description: 权限级别 `LOGIN`。修改当前登录用户密码。
      operationId: changeCurrentUserPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              oldPassword: Passw0rd!
              newPassword: NewPassw0rd!
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoDataResponse'
              example:
                code: 0
                message: 成功
                data: null
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
  /api/v1/admin/comments:
    get:
      tags:
        - Admin Comments
      summary: 获取后台评论分页列表
      description: 权限级别 `ADMIN`。支持按文章、作者、状态和评论层级筛选，默认按创建时间倒序。
      operationId: listAdminComments
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
        - name: articleId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: userId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED, HIDDEN, DELETED]
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [TOP_LEVEL, REPLY]
      responses:
        '200':
