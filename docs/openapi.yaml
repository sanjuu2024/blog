  /api/v1/admin/articles/{articleId}:
    get:
      tags:
        - Admin Articles
      summary: 获取后台文章详情
      description: 权限级别 `ADMIN`。
      operationId: getAdminArticleDetail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ArticleId'
      responses:
        '200':
          description: 获取成功
          content:
