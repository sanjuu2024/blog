      tags:
        - Admin Categories
      summary: 获取分类列表
      description: 权限级别 `ADMIN`。不传 `keyword`、`level` 和 `parentId` 时返回完整分类树；传 `keyword` 时返回分类名称匹配的平铺列表，且可与 `status`、`level`、`parentId` 组合筛选；传 `parentId` 时返回该一级分类下的二级分类平铺列表；传 `level=2` 时返回二级分类平铺列表；传 `level=1` 时返回一级分类平铺列表。平铺列表节点的 `children` 为空数组。`parentId` 不能与 `level=1` 同时使用；`parentId` 与 `level=2` 同时使用时，`level=2` 只是冗余限定。
      operationId: listAdminCategories
      security:
        - bearerAuth: []
      parameters:
        - name: keyword
          in: query
          description: 分类名称模糊搜索
          required: false
          schema:
            type: string
            example: Java
        - name: status
          in: query
          description: 分类状态筛选
          required: false
          schema:
            type: string
            enum:
              - ENABLED
              - DISABLED
            example: ENABLED
        - name: level
          in: query
          description: 分类层级筛选，1 为一级分类平铺列表，2 为二级分类平铺列表
          required: false
          schema:
            type: integer
            enum:
              - 1
              - 2
            example: 2
        - name: parentId
          in: query
          description: 父分类 ID，查询某个一级分类下的二级分类平铺列表时使用
          required: false
          schema:
            type: integer
            format: int64
            example: 20001
