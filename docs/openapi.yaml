      summary: 更新标签
      description: 权限级别 `ADMIN`。
      operationId: updateAdminTag
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TagId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagUpsertRequest'
            example:
              name: JWT
              description: 认证授权相关文章
              status: ENABLED
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagUpdateResponse'
              example:
                code: 0
                message: 成功
                data:
                  id: 30001
                  name: JWT
                  status: ENABLED
                  updatedAt: '2026-04-23T00:13:00+08:00'
    delete:
      tags:
        - Admin Tags
      summary: 删除标签
      description: 权限级别 `ADMIN`。删除后可同步清理文章标签关联关系。
      operationId: deleteAdminTag
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TagId'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoDataResponse'
              example:
                code: 0
                message: 成功
                data: null
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PageNum:
      name: pageNum
      in: query
      description: 当前页码，从 1 开始，默认 1
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1
    PageSize:
      name: pageSize
      in: query
      description: 每页条数，默认 10
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 10
        example: 10
    RefreshTokenCookie:
      name: refresh_token
      in: cookie
      description: Refresh Token HttpOnly Cookie，由浏览器自动携带，前端 JavaScript 不读取该值
      required: true
      schema:
        type: string
        example: eyJhbGciOiJIUzI1NiJ9.refresh.token
    RefreshTokenCookieOptional:
      name: refresh_token
      in: cookie
      description: Refresh Token HttpOnly Cookie；退出登录时缺失也按幂等退出处理
      required: false
      schema:
        type: string
        example: eyJhbGciOiJIUzI1NiJ9.refresh.token
    ArticleId:
      name: articleId
      in: path
      description: 文章 ID。P0 使用文章 ID 作为 URL 稳定定位标识，P2 可在前台 URL 中追加 slug 提升可读性。
      required: true
      schema:
        type: integer
        format: int64
        example: 40001
    CategoryId:
      name: categoryId
      in: path
      description: 分类 ID
      required: true
      schema:
        type: integer
        format: int64
        example: 20001
    TagId:
      name: tagId
      in: path
      description: 标签 ID
      required: true
      schema:
        type: integer
        format: int64
        example: 30001
    UserId:
      name: userId
      in: path
      description: 用户 ID
      required: true
      schema:
        type: integer
        format: int64
        example: 10002
    CommentId:
      name: commentId
      in: path
      description: 评论 ID；回复接口中必须是顶层评论 ID
      required: true
      schema:
        type: integer
        format: int64
        example: 50001
    ReplyLimit:
      name: limit
      in: query
      description: 本次获取回复条数，首次默认 5，后续请求默认 10
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 5
    ReplyCursor:
      name: cursor
      in: query
      description: 上一次响应返回的不透明游标，首次请求不传，前端不得解析或构造
      required: false
      schema:
        type: string
  schemas:
    BaseResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: 业务状态码，`0` 表示成功
          example: 0
        message:
          type: string
          description: 业务描述信息
          example: 成功
    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              nullable: true
              description: 错误场景通常为空
              example: null
    NoDataResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              nullable: true
              description: 无业务数据返回
              example: null
    PagedMeta:
      type: object
      required:
        - pageNum
        - pageSize
        - total
        - totalPages
        - hasNext
      properties:
        pageNum:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 10
        total:
          type: integer
          format: int64
          example: 35
        totalPages:
          type: integer
          example: 4
        hasNext:
          type: boolean
          example: true
    SimpleTag:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          example: 30001
        name:
          type: string
          example: JWT
    CategoryParentRef:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          example: 20001
        name:
          type: string
          example: 技术
    SimpleCategory:
      type: object
      required:
        - id
        - name
        - level
        - parent
      properties:
        id:
          type: integer
          format: int64
          example: 21001
        name:
          type: string
          example: Java
        level:
          type: integer
          enum:
            - 2
          example: 2
        parent:
          $ref: '#/components/schemas/CategoryParentRef'
    SimpleAuthor:
      type: object
      required:
        - id
        - username
        - nickname
        - avatarUrl
        - bio
      properties:
        id:
          type: integer
          format: int64
          example: 10001
        username:
          type: string
          example: ccsanjuu
        nickname:
          type: string
          example: sanjuu
        avatarUrl:
          type: string
          example: https://cdn.example.com/avatar/1.png
        bio:
          type: string
          example: 专注后端和前端工程化
    LoginUserInfo:
      type: object
      required:
        - id
        - username
        - nickname
        - email
        - role
        - status
        - avatarUrl
        - bio
      properties:
        id:
          type: integer
          format: int64
          example: 10002
        username:
          type: string
          example: alice_dev
        nickname:
          type: string
          example: Alice
        email:
          type: string
          format: email
          example: alice@example.com
        role:
          type: string
          enum:
            - ADMIN
            - USER
          example: USER
        status:
          type: string
          enum:
            - ACTIVE
            - DISABLED
          example: ACTIVE
        avatarUrl:
          type: string
          example: ''
        bio:
          type: string
          example: 热爱前后端开发
    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 4
          maxLength: 20
          pattern: '^[\u4e00-\u9fa5A-Za-z0-9_-]{4,20}$'
          description: 用户名，只允许中文、英文、数字、下划线和短横线，需唯一
          example: alice_dev
        email:
          type: string
          format: email
          maxLength: 255
          pattern: '^[A-Za-z0-9](?:[A-Za-z0-9._%+\-]{0,62}[A-Za-z0-9])?@(?:[A-Za-z0-9](?:[A-Za-z0-9\-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}$'
          description: 邮箱，仅支持常见邮箱格式，不能包含空格或中文字符，需唯一
          example: alice@example.com
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 20
          pattern: '^[\u4e00-\u9fa5A-Za-z0-9_\-!@#$%^&*()+=\[\]{}:;''",.?/~`|\\<>]+$'
          description: 登录密码，允许中文、英文、数字、下划线、短横线和常用 ASCII 特殊字符，不允许空格
          example: Passw0rd!
    LoginRequest:
      type: object
      required:
        - account
        - password
      properties:
        account:
          type: string
          maxLength: 255
          pattern: '^(?:[\u4e00-\u9fa5A-Za-z0-9_-]{4,20}|[A-Za-z0-9](?:[A-Za-z0-9._%+\-]{0,62}[A-Za-z0-9])?@(?:[A-Za-z0-9](?:[A-Za-z0-9\-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63})$'
          description: 登录账号，必须是合法用户名或邮箱；包含 `@` 时按邮箱登录，否则按用户名登录
          example: alice@example.com
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 20
          pattern: '^[\u4e00-\u9fa5A-Za-z0-9_\-!@#$%^&*()+=\[\]{}:;''",.?/~`|\\<>]+$'
          description: 登录密码，允许中文、英文、数字、下划线、短横线和常用 ASCII 特殊字符，不允许空格
          example: Passw0rd!
    RegisterResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              nullable: true
              description: 注册成功后无需返回用户数据，前端据此提示“注册成功，请登录”
              example: null
    LoginData:
      type: object
      required:
        - accessToken
        - accessTokenExpiresAt
        - refreshTokenExpiresAt
        - tokenType
        - user
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9.access.token
        accessTokenExpiresAt:
          type: string
          format: date-time
          example: '2026-04-22T22:35:00+08:00'
        refreshTokenExpiresAt:
          type: string
          format: date-time
          description: Refresh Token Cookie 过期时间
          example: '2026-04-29T22:20:00+08:00'
        tokenType:
          type: string
          example: Bearer
        user:
          $ref: '#/components/schemas/LoginUserInfo'
    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/LoginData'
    RefreshTokenData:
      type: object
      required:
        - accessToken
        - accessTokenExpiresAt
        - refreshTokenExpiresAt
        - tokenType
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9.new.access
        accessTokenExpiresAt:
          type: string
          format: date-time
          example: '2026-04-22T23:05:00+08:00'
        refreshTokenExpiresAt:
          type: string
          format: date-time
          description: Refresh Token Cookie 过期时间
          example: '2026-04-29T22:50:00+08:00'
        tokenType:
          type: string
          example: Bearer
    RefreshTokenResponse:
