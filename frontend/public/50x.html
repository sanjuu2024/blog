<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex" />
		<meta name="theme-color" content="#f0ead9" />
		<title>服务暂时不可用</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<style>
			:root {
				color-scheme: light;
				--app-button-bg: #587f5c;
				--app-button-hover: #4f7a55;
				font-family:
					-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei',
					sans-serif;
				font-synthesis: none;
				text-rendering: optimizeLegibility;
				-webkit-font-smoothing: antialiased;
				-moz-osx-font-smoothing: grayscale;
				color: #1f2933;
				background: #f0ead9;
			}

			* {
				box-sizing: border-box;
			}

			body {
				min-width: 320px;
				min-height: 100vh;
				margin: 0;
				background: #f0ead9;
			}

			main {
				display: grid;
				min-height: 100vh;
				place-content: center;
				justify-items: center;
				padding: 2rem 1.25rem;
				text-align: center;
			}

			.error-illustration {
				display: block;
				width: min(100%, 20rem);
				height: 15rem;
				margin-bottom: 1.5rem;
				object-fit: contain;
			}

			h1 {
				margin: 0;
				font-size: 1.5rem;
				font-weight: bold;
				line-height: 1.4;
			}

			p {
				max-width: 28rem;
				margin: 0.75rem 0 1.5rem;
				color: #4f4f4f;
				font-size: 1rem;
				line-height: 1.6;
			}

			.actions {
				display: flex;
				flex-wrap: wrap;
				justify-content: center;
				gap: 0.75rem;
			}

			button,
			.actions a {
				display: inline-flex;
				height: auto;
				min-height: 2.75rem;
				align-items: center;
				justify-content: center;
				padding: 0.625rem 1rem;
				border: 1px solid var(--app-button-bg);
				border-radius: 6px;
				font: inherit;
				font-size: 0.9375rem;
				font-weight: 500;
				line-height: 1.4;
				text-decoration: none;
				cursor: pointer;
			}

			button {
				background: var(--app-button-bg);
				color: #fff;
			}

			.actions a {
				border-color: #c5d1ce;
				background: #fff;
				color: #263238;
			}

			button:hover {
				border-color: var(--app-button-hover);
				background: var(--app-button-hover);
			}

			.actions a:hover {
				background: #edf3f1;
			}

			button:focus-visible,
			.actions a:focus-visible {
				outline: 3px solid #80b8b1;
				outline-offset: 3px;
			}

			.actions form {
				margin: 0;
			}
		</style>
	</head>
	<body>
		<main>
			<img class="error-illustration" src="/img/50x.avif" alt="" />
			<h1>服务暂时不可用</h1>
			<p>服务器暂时无法完成请求，请稍后重试。</p>
			<div class="actions">
				<form action="" method="get">
					<button type="submit">重试</button>
				</form>
				<a href="/">返回首页</a>
			</div>
		</main>
	</body>
</html>
