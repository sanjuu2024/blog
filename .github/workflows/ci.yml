name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code style
        run: pnpm lint

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-vitest-coverage
          path: frontend/coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Build frontend
        run: pnpm build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BLOG_TEST_DB_URL: jdbc:postgresql://localhost:5432/blog_test
      BLOG_TEST_DB_USERNAME: sanjuu
      BLOG_TEST_DB_PASSWORD: sanjuu
      BLOG_TEST_JWT_SECRET: Y2ktb25seS1qd3Qtc2VjcmV0LWF0LWxlYXN0LTMyLWJ5dGVzLWxvbmc=
      BLOG_REDIS_HOST: localhost
      BLOG_REDIS_PORT: 6379
      BLOG_REDIS_PASSWORD: ""
      BLOG_TEST_REDIS_DATABASE: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Start PostgreSQL and Redis
        run: docker compose up -d --build --wait blog_db blog_redis

      - name: Create test database
        run: docker exec blog_db createdb -U sanjuu blog_test

      - name: Verify backend
        working-directory: backend
        run: bash ./mvnw --batch-mode verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14
          
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop test infrastructure
        if: always()
        run: docker compose down -v